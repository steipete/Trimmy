name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          ./Scripts/install_lint_tools.sh "$RUNNER_TEMP/trimmy-lint"
          echo "$RUNNER_TEMP/trimmy-lint" >> "$GITHUB_PATH"
      - name: SwiftFormat
        run: swiftformat . --lint
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: Packaging script tests
        run: python3 -m unittest discover -s Scripts/tests -v

  test-macos:
    name: macOS Swift ${{ matrix.swift }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2.4", "6.3.3"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ matrix.swift }}
      - name: Swift tests
        run: swift test --parallel
      - name: Release app build
        if: matrix.swift == '6.3.3'
        run: swift build -c release --product Trimmy

  build-linux-cli:
    name: Linux Swift ${{ matrix.swift }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2.4", "6.3.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ matrix.swift }}
      - name: Portable core and CLI tests
        run: swift test --parallel
      - name: Build release CLI with static Swift standard library
        run: swift build -c release --product TrimmyCLI --static-swift-stdlib
      - name: Smoke test release CLI
        run: |
          BIN_DIR="$(swift build -c release --product TrimmyCLI --static-swift-stdlib --show-bin-path)"
          python3 Scripts/smoke_cli.py "$BIN_DIR/TrimmyCLI"
