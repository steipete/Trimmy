name: Release CLI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions: {}

jobs:
  build-linux-cli:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Swift 6.4.0
        run: ./Scripts/install_swift_ci.sh 6.4.0

      - name: Build TrimmyCLI (release)
        run: swift build --build-system native -c release --product TrimmyCLI --static-swift-stdlib

      - name: Package Linux CLI
        id: pkg
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          if [[ -z "$TAG" ]]; then
            TAG="dev"
          fi

          BIN_DIR="$(swift build --build-system native -c release --product TrimmyCLI --static-swift-stdlib --show-bin-path)"
          source version.env
          CLI_VERSION="$("$BIN_DIR/TrimmyCLI" --version)"
          echo "$CLI_VERSION"
          [[ "$CLI_VERSION" == "TrimmyCLI $MARKETING_VERSION" ]]
          OUT_DIR="$RUNNER_TEMP/trimmy-cli-out"
          mkdir -p "$OUT_DIR"

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x86_64" ;;
            aarch64|arm64) ARCH="aarch64" ;;
          esac

          ASSET="TrimmyCLI-${TAG}-linux-${ARCH}.tar.gz"
          (cd "$BIN_DIR" && tar czf "$OUT_DIR/$ASSET" TrimmyCLI)

          (cd "$OUT_DIR" && sha256sum "$ASSET" > "$ASSET.sha256")

          {
            echo "tag=$TAG"
            echo "out_dir=$OUT_DIR"
            echo "asset=$ASSET"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact (manual runs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: payload-cli-linux
          path: |
            ${{ steps.pkg.outputs.out_dir }}/${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.out_dir }}/${{ steps.pkg.outputs.asset }}.sha256
